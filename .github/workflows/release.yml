name: 發布

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -notmatch '^v\d+\.\d+\.\d+$') {
            throw "標籤必須為 v主版.次版.修正版，例如 v1.2.1。"
          }
      - shell: pwsh
        run: .\release.ps1 -Version "${{ github.ref_name }}"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/PasswordToolsGUI.exe
            release/SHA256SUMS.txt
            release/PasswordToolsGUI-${{ github.ref_name }}.zip
